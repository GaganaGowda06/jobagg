name: daily-classify

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: daily-classify
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      REED_API_KEY: ${{ secrets.REED_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q

      - name: Classify Ashby
        run: uv run python scripts/classify_ashby_batch.py

      - name: Classify Lever
        run: uv run python scripts/classify_lever_batch.py

      - name: Classify Greenhouse
        run: uv run python scripts/classify_greenhouse_batch.py

      - name: Send digest
        run: uv run python scripts/send_digest.py

      - name: Commit database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobagg.db
          if git diff --cached --quiet; then
            echo "No database changes today."
          else
            git commit -m "Daily run: $(date -u +%Y-%m-%d)"
            git push
          fi
